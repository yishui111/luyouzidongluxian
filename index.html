<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>新疆旅游路线自动生成器</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <header class="brand">
      <h1>新疆旅游路线<span>自动生成</span></h1>
      <p class="sub">输入景点名称，自动在地图上连成轨迹</p>
    </header>

    <div class="search-wrap">
      <input id="searchInput" type="text" placeholder="输入景点名称 / 拼音，如：喀纳斯、kanas" autocomplete="off">
      <div id="suggestions" class="suggestions"></div>
    </div>

    <div class="examples">
      <button class="ex" data-ex="north">北疆经典</button>
      <button class="ex" data-ex="duku">独库公路</button>
      <button class="ex" data-ex="south">南疆风情</button>
      <button class="ex" data-ex="loop">全景大环线</button>
    </div>

    <div class="color-row">
      <span class="color-label">轨迹颜色</span>
      <input type="color" id="colorPick" value="#22d3ee" title="自定义轨迹颜色">
      <div class="swatches">
        <button class="swatch" data-c="#22d3ee" style="background:#22d3ee" title="青蓝"></button>
        <button class="swatch" data-c="#a855f7" style="background:#a855f7" title="紫色"></button>
        <button class="swatch" data-c="#f472b6" style="background:#f472b6" title="粉色"></button>
        <button class="swatch" data-c="#fb923c" style="background:#fb923c" title="橙色"></button>
        <button class="swatch" data-c="#34d399" style="background:#34d399" title="绿色"></button>
        <button class="swatch" data-c="#ef4444" style="background:#ef4444" title="红色"></button>
        <button class="swatch grad-swatch active" data-c="" title="恢复默认渐变">渐</button>
      </div>
    </div>

    <div class="color-row text-style-row">
      <span class="color-label">文字颜色</span>
      <input type="color" id="textColorPick" value="#eaf2ff" title="景点文字颜色">
      <span class="color-label">文字背景</span>
      <input type="color" id="chipBgPick" value="#0e1830" title="景点标签背景颜色">
    </div>

    <div class="list-head">
      <span>已选景点（<b id="statCount">0</b>）</span>
      <div class="mini-btns">
        <button id="sortBtn" title="从第一个景点开始，就近依次连接">智能排序</button>
        <button id="clearBtn">清空</button>
      </div>
    </div>

    <div id="selectedList" class="sel-list"></div>
    <div id="emptyHint" class="empty">还没有景点<br>搜索添加，或直接点击地图上的圆点</div>

    <div class="stats">
      <div class="stat"><label>总里程（直线）</label><b id="statKm">0 km</b></div>
      <div class="stat"><label>预估驾车</label><b id="statHours">—</b></div>
    </div>

    <div class="play-ctrl">
      <div class="play-row">
        <button id="playBtn" class="primary" disabled>▶ 播放轨迹</button>
        <button id="replayBtn" disabled>重新播放</button>
        <select id="speedSel" title="播放速度">
          <option value="0.5">0.5x</option>
          <option value="1" selected>1x</option>
          <option value="2">2x</option>
          <option value="4">4x</option>
        </select>
      </div>
      <div id="routeInfo" class="route-info">添加至少两个景点开始</div>
      <div class="progress"><div id="routeProgress"></div></div>
    </div>

    <footer class="foot">
      <button id="shareBtn" class="link">复制分享链接</button>
      <span>直线距离仅供参考 · 滚轮缩放 · 拖动平移</span>
    </footer>
  </aside>

  <main id="mapWrap">
    <svg id="mapSvg" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid meet">
      <defs>
        <linearGradient id="routeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#22d3ee"/>
          <stop offset="55%" stop-color="#818cf8"/>
          <stop offset="100%" stop-color="#f472b6"/>
        </linearGradient>
        <radialGradient id="dotGlow" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.85"/>
          <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0"/>
        </radialGradient>
        <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
          <feGaussianBlur stdDeviation="3" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
        <pattern id="grid" width="100" height="100" patternUnits="userSpaceOnUse">
          <path d="M 100 0 L 0 0 0 100" fill="none" stroke-width="1"/>
        </pattern>
        <symbol id="carIcon" viewBox="0 0 24 24">
          <rect x="3" y="6" width="18" height="12" rx="3.5" fill="#e8f8ff" stroke="#38bdf8" stroke-width="1"/>
          <rect x="9.5" y="8" width="3.5" height="8" rx="1.5" fill="#38bdf8"/>
          <rect x="14.5" y="8.5" width="3" height="7" rx="1.2" fill="#0ea5e9"/>
          <rect x="4.2" y="6.8" width="3.2" height="2.8" rx="1" fill="#0b1220"/>
          <rect x="4.2" y="14.4" width="3.2" height="2.8" rx="1" fill="#0b1220"/>
          <rect x="16.6" y="6.8" width="3.2" height="2.8" rx="1" fill="#0b1220"/>
          <rect x="16.6" y="14.4" width="3.2" height="2.8" rx="1" fill="#0b1220"/>
        </symbol>
      </defs>
      <rect id="mapBg" x="0" y="0" width="1000" height="1000"/>
      <rect x="0" y="0" width="1000" height="1000" fill="url(#grid)"/>
      <g id="mapGroup">
        <g id="outlineG"></g>
        <g id="markerG"></g>
        <g id="routeLayer"></g>
        <g id="routeTrail"></g>
        <g id="routePoints"></g>
        <g id="routeLabels"></g>
      </g>
    </svg>

    <div id="tooltip" class="tooltip"></div>

    <div class="map-tools">
      <div class="theme-wrap">
        <button id="themeBtn" title="切换地图样式">🎨</button>
        <div id="themePanel" class="theme-panel">
          <div class="theme-opt active" data-theme="dark"><i style="background:#0a101f;border-color:#a9c1e8"></i><span>深蓝</span></div>
          <div class="theme-opt" data-theme="light"><i style="background:#eef2f8;border-color:#4a6a95"></i><span>浅色</span></div>
          <div class="theme-opt" data-theme="gold"><i style="background:#0b0a06;border-color:#d4af37"></i><span>黑金</span></div>
          <div class="theme-opt" data-theme="aurora"><i style="background:#05130c;border-color:#6ee7a8"></i><span>极光绿</span></div>
        </div>
      </div>
      <button id="zoomIn" title="放大">＋</button>
      <button id="zoomOut" title="缩小">－</button>
      <button id="fitBtn" title="路线居中放大">⤢</button>
      <button id="resetView" title="恢复视野">⌂</button>
    </div>

    <div class="legend">
      <span class="lg"><i class="dot dot-n"></i>自然</span>
      <span class="lg"><i class="dot dot-c"></i>人文</span>
      <span class="lg"><i class="lg-start"></i>起点</span>
      <span class="lg"><i class="lg-mid"></i>途经</span>
      <span class="lg"><i class="lg-end"></i>终点</span>
    </div>

    <div id="mapHint" class="map-hint">搜索景点或点击地图上的圆点，开始你的新疆之旅</div>
    <div id="toast" class="toast"></div>
    <div class="vignette"></div>
    <div class="map-watermark">新疆 · 旅游路线</div>

    <div id="arrivalCard" class="arrival-card">
      <div class="arrival-badge" id="arrivalBadge">1</div>
      <div class="arrival-body">
        <div class="arrival-title" id="arrivalTitle">起点</div>
        <div class="arrival-meta" id="arrivalMeta"></div>
        <div class="arrival-desc" id="arrivalDesc"></div>
      </div>
    </div>
  </main>
</div>

<script src="data/xinjiang.js"></script>
<script src="data/attractions.js"></script>
<script src="js/main.js"></script>
</body>
</html>
